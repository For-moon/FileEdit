<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bàn ghép slide</title>
<style>
  :root{
    --paper:#eceff4; --card:#fbfcfe; --ink:#16213a; --mut:#5d6882; --line:#cfd6e4;
    --hl:#ffd23f; --hl-ink:#16213a; --focus:#2f5bea;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#0f1626;--card:#18223a;--ink:#e7ebf5;--mut:#8f9bb8;--line:#2a3656;--focus:#8fb0ff}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  button{font:inherit;color:inherit}

  /* khung trang */
  header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
  .head{max-width:1100px;margin:0 auto;padding:14px 16px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 28px}
  h1{font:600 26px/1.1 var(--serif);margin:0 0 12px;letter-spacing:-.01em}
  nav{display:flex;gap:4px}
  nav button{background:none;border:0;padding:10px 14px 9px;cursor:pointer;color:var(--mut);border-bottom:4px solid transparent;font-weight:600}
  nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--hl)}
  #info{margin:0 0 12px auto;color:var(--mut);font-size:14px}
  main{max-width:1100px;margin:0 auto;padding:20px 16px 72px}
  section[hidden]{display:none}

  /* nút */
  .btn{padding:10px 18px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;font-weight:600}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.hl{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}

  /* vùng thả file */
  .drop{border:2px dashed var(--line);border-radius:10px;padding:34px 16px;text-align:center;color:var(--mut);cursor:pointer;background:var(--card)}
  .drop.over,.drop:hover{border-color:var(--ink);color:var(--ink)}

  /* lưới dạng contact sheet */
  .sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:16px}
  .tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .tile .no{position:absolute;left:0;top:0;z-index:1;min-width:28px;padding:1px 8px;background:var(--ink);color:var(--paper);font:600 13px/1.6 var(--sans)}
  .tile .pic{display:flex;align-items:center;justify-content:center;min-height:120px;background:var(--paper)}
  .tile img,.tile canvas{display:block;max-width:100%;height:auto;max-height:160px;object-fit:contain}
  .tile .cap{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);min-height:30px}
  .tile.edit{cursor:grab}
  .tile.drag{opacity:.35}
  .tile.edit:hover,.tile.view:hover{border-color:var(--ink)}
  .tile.view{cursor:pointer;border:0;padding:0;text-align:left;font:inherit;border:1px solid var(--line)}
  .tile.view:hover .cap{background:var(--hl);color:var(--hl-ink)}
  .tile.edit .cap button{background:none;border:0;cursor:pointer;padding:2px 6px;color:var(--ink)}
  .tile.edit .cap button:hover{background:var(--hl);color:var(--hl-ink)}

  /* tuỳ chọn */
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:20px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:6px}
  label{display:block;font-size:13px;color:var(--mut);font-weight:600}
  select,input[type=number],input[type=text]{width:100%;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit}
  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
  #st{color:var(--mut)}

  /* xem từng trang */
  #lb{position:fixed;inset:0;z-index:20;background:rgba(8,12,22,.94);display:none}
  #lb.on{display:block}
  #stage{position:absolute;inset:0;overflow:auto;display:flex;padding:60px 0 20px}
  #stage canvas{margin:auto;display:block;flex:none}
  .bar{position:fixed;left:0;right:0;top:0;z-index:2;display:flex;justify-content:center;align-items:center;gap:8px;padding:10px;color:#fff}
  .bar button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
  .bar button:hover{background:var(--hl);color:var(--hl-ink)}
  .bar .x{position:absolute;right:12px}
  #pg{min-width:70px;text-align:center}
  @media (max-width:520px){ h1{font-size:22px} #info{margin-left:0} }
</style>
</head>
<body>
<header>
  <div class="head">
    <h1>Bàn ghép slide</h1>
    <nav role="tablist" aria-label="Chế độ">
      <button role="tab" id="t-merge" aria-selected="true">Ghép ảnh thành PDF</button>
      <button role="tab" id="t-view" aria-selected="false">Xem PDF</button>
    </nav>
    <span id="info"></span>
  </div>
</header>

<main>
  <!-- GHÉP ẢNH -->
  <section id="p-merge">
    <div class="drop" id="drop" tabindex="0" role="button">Kéo thả ảnh vào đây hoặc bấm để chọn ảnh (JPG, PNG, WebP…)</div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div class="sheet" id="list"></div>

    <div class="opts">
      <label>Khổ giấy
        <select id="size">
          <option value="fit">Vừa với từng ảnh</option>
          <option value="a4" selected>A4 (tự xoay theo ảnh)</option>
          <option value="a4p">A4 dọc</option>
          <option value="a4l">A4 ngang</option>
        </select>
      </label>
      <label>Lề (mm)<input id="margin" type="number" min="0" max="50" value="0"></label>
      <label>Chất lượng JPEG (%)<input id="q" type="number" min="30" max="100" value="92"></label>
      <label>Tên file<input id="name" type="text" value="anh-ghep"></label>
    </div>

    <div class="actions">
      <button class="btn" id="go" disabled>Tạo PDF</button>
      <button class="btn hl" id="seeNow" hidden>Xem ngay</button>
      <button class="btn ghost" id="clear" disabled>Xóa tất cả</button>
      <span id="st"></span>
    </div>
  </section>

  <!-- XEM PDF -->
  <section id="p-view" hidden>
    <div class="drop" id="vdrop" tabindex="0" role="button">Kéo thả file PDF vào đây hoặc bấm để chọn file</div>
    <input id="vfile" type="file" accept="application/pdf" hidden>
    <div class="actions" id="vact" hidden>
      <button class="btn ghost" id="vother">Mở file PDF khác</button>
      <span id="vst"></span>
    </div>
    <div class="sheet" id="vgrid"></div>
  </section>
</main>

<div id="lb" role="dialog" aria-modal="true" aria-label="Xem trang">
  <div class="bar">
    <button id="prev" aria-label="Trang trước">◀</button>
    <span id="pg"></span>
    <button id="next" aria-label="Trang sau">▶</button>
    <button id="fit">Vừa màn hình / 150%</button>
    <button class="x" id="close" aria-label="Đóng">✕</button>
  </div>
  <div id="stage"></div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ============ Chuyển chế độ ============ */
function setTab(name) {
  for (const n of ['merge', 'view']) {
    $('p-' + n).hidden = n !== name;
    $('t-' + n).setAttribute('aria-selected', n === name);
  }
  $('info').textContent = name === 'view' && pdf ? viewInfo : '';
}
$('t-merge').onclick = () => setTab('merge');
$('t-view').onclick = () => setTab('view');

/* ============ GHÉP ẢNH → PDF ============ */
let items = [], dragIdx = null, lastBlob = null, lastName = '';

function add(files) {
  for (const f of files) if (f.type.startsWith('image/')) items.push({ file: f, url: URL.createObjectURL(f) });
  render();
}

function render() {
  const list = $('list');
  list.innerHTML = '';
  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'tile edit';
    d.draggable = true;
    d.innerHTML = `<span class="no">${i + 1}</span><div class="pic"><img src="${it.url}" alt="Ảnh ${i + 1}"></div><div class="cap"><span><button data-a="l" aria-label="Chuyển lên trước">◀</button><button data-a="r" aria-label="Chuyển ra sau">▶</button></span><button data-a="x" aria-label="Xóa ảnh">✕</button></div>`;
    d.addEventListener('dragstart', () => { dragIdx = i; d.classList.add('drag'); });
    d.addEventListener('dragend', () => d.classList.remove('drag'));
    d.addEventListener('dragover', e => e.preventDefault());
    d.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      if (dragIdx === null || dragIdx === i) return;
      items.splice(i, 0, items.splice(dragIdx, 1)[0]);
      dragIdx = null; render();
    });
    d.addEventListener('click', e => {
      const a = e.target.dataset.a;
      if (!a) return;
      if (a === 'x') { URL.revokeObjectURL(it.url); items.splice(i, 1); }
      if (a === 'l' && i > 0) [items[i - 1], items[i]] = [items[i], items[i - 1]];
      if (a === 'r' && i < items.length - 1) [items[i + 1], items[i]] = [items[i], items[i + 1]];
      render();
    });
    list.appendChild(d);
  });
  $('go').disabled = $('clear').disabled = !items.length;
  $('st').textContent = items.length ? `${items.length} ảnh` : '';
}

function wireDrop(zone, input, onFiles) {
  zone.onclick = () => input.click();
  zone.onkeydown = e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), input.click());
  input.onchange = e => { onFiles(e.target.files); e.target.value = ''; };
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('over'); };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('over'); onFiles(e.dataTransfer.files); };
}
wireDrop($('drop'), $('file'), add);
$('clear').onclick = () => { items.forEach(i => URL.revokeObjectURL(i.url)); items = []; render(); };

const MM = 72 / 25.4, A4 = [595.28, 841.89];

async function toJpeg(file, quality) {
  const bmp = await createImageBitmap(file);
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(bmp, 0, 0);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
  return { w: c.width, h: c.height, bytes: new Uint8Array(await blob.arrayBuffer()) };
}

function buildPdf(pages) {
  const enc = new TextEncoder(), parts = [], offs = [];
  let pos = 0;
  const put = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); pos += b.length; };
  const f = n => n.toFixed(2), N = pages.length;

  put('%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n');
  offs[1] = pos; put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2] = pos;
  put(`2 0 obj\n<< /Type /Pages /Count ${N} /Kids [${pages.map((_, i) => `${5 + i * 3} 0 R`).join(' ')}] >>\nendobj\n`);
  pages.forEach((p, i) => {
    const im = 3 + i * 3, ct = im + 1, pg = im + 2;
    offs[im] = pos;
    put(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`);
    put(p.bytes); put('\nendstream\nendobj\n');
    const content = `q ${f(p.dw)} 0 0 ${f(p.dh)} ${f(p.x)} ${f(p.y)} cm /Im0 Do Q`;
    offs[ct] = pos;
    put(`${ct} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    offs[pg] = pos;
    put(`${pg} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(p.pw)} ${f(p.ph)}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>\nendobj\n`);
  });
  const total = 3 + N * 3, xref = pos;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let n = 1; n < total; n++) x += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
  put(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}

$('go').onclick = async () => {
  const mode = $('size').value;
  const m = Math.max(0, +$('margin').value || 0) * MM;
  const q = Math.min(1, Math.max(0.3, (+$('q').value || 92) / 100));
  $('go').disabled = true; $('seeNow').hidden = true;
  try {
    const pages = [];
    for (let i = 0; i < items.length; i++) {
      $('st').textContent = `Đang xử lý ${i + 1}/${items.length}...`;
      const j = await toJpeg(items[i].file, q);
      let pw, ph;
      if (mode === 'fit') { pw = j.w * 0.75 + 2 * m; ph = j.h * 0.75 + 2 * m; }
      else if (mode === 'a4p') [pw, ph] = A4;
      else if (mode === 'a4l') [pw, ph] = [A4[1], A4[0]];
      else [pw, ph] = j.w > j.h ? [A4[1], A4[0]] : A4;
      const s = Math.min((pw - 2 * m) / j.w, (ph - 2 * m) / j.h);
      const dw = j.w * s, dh = j.h * s;
      pages.push({ ...j, pw, ph, dw, dh, x: (pw - dw) / 2, y: (ph - dh) / 2 });
    }
    lastBlob = buildPdf(pages);
    lastName = ($('name').value.trim() || 'anh-ghep') + '.pdf';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(lastBlob); a.download = lastName; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    $('st').textContent = `Đã lưu ${lastName}: ${pages.length} trang, ${(lastBlob.size / 1048576).toFixed(2)} MB`;
    $('seeNow').hidden = false;
  } catch (e) { $('st').textContent = 'Lỗi: ' + e.message; }
  $('go').disabled = !items.length;
};

$('seeNow').onclick = () => { setTab('view'); openPdf(lastBlob, lastName); };

/* ============ XEM PDF ============ */
// pdf.js chỉ được tải khi bạn mở tab Xem PDF, nên phần ghép ảnh chạy được cả khi offline.
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdf = null, viewInfo = '', cur = 0, fitMode = true, token = 0, pdfjsP = null;

function loadPdfjs() {
  return pdfjsP ||= (async () => {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = PDFJS + 'pdf.min.js'; s.onload = res;
      s.onerror = () => rej(new Error('Không tải được pdf.js, cần kết nối internet'));
      document.head.appendChild(s);
    });
    const t = await (await fetch(PDFJS + 'pdf.worker.min.js')).text(); // blob để chạy được với file://
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' }));
  })().catch(e => { pdfjsP = null; throw e; });
}

wireDrop($('vdrop'), $('vfile'), fs => fs[0] && openPdf(fs[0], fs[0].name));
$('vother').onclick = () => $('vfile').click();

async function openPdf(src, name) {
  try {
    $('vst').textContent = 'Đang mở...';
    await loadPdfjs();
    pdf = await pdfjsLib.getDocument({ data: await src.arrayBuffer() }).promise;
  } catch (e) { $('vst').textContent = 'Lỗi: ' + e.message; $('vact').hidden = false; return; }
  $('vdrop').hidden = true; $('vact').hidden = false;
  viewInfo = `${name}: ${pdf.numPages} trang`;
  $('vst').textContent = viewInfo; $('info').textContent = viewInfo;
  buildGrid();
}

function buildGrid() {
  const grid = $('vgrid'); grid.innerHTML = '';
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) { io.unobserve(en.target); thumb(en.target); }
  }), { rootMargin: '300px' });
  for (let i = 1; i <= pdf.numPages; i++) {
    const d = document.createElement('button');
    d.className = 'tile view'; d.dataset.p = i;
    d.setAttribute('aria-label', `Xem trang ${i}`);
    d.innerHTML = `<span class="no">${i}</span><div class="pic"></div><div class="cap">Trang ${i}</div>`;
    d.onclick = () => openPage(i);
    grid.appendChild(d); io.observe(d);
  }
}

async function thumb(el) {
  const page = await pdf.getPage(+el.dataset.p);
  const v0 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: 340 / v0.width });
  const c = document.createElement('canvas');
  c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  el.querySelector('.pic').appendChild(c);
}

async function show() {
  const my = ++token;
  const page = await pdf.getPage(cur);
  const v0 = page.getViewport({ scale: 1 });
  const dpr = window.devicePixelRatio || 1;
  const fit = Math.min(innerWidth / v0.width, (innerHeight - 80) / v0.height);
  const vp = page.getViewport({ scale: (fitMode ? fit : 1.5) * dpr });
  const c = document.createElement('canvas');
  c.width = vp.width; c.height = vp.height;
  c.style.width = vp.width / dpr + 'px'; c.style.height = vp.height / dpr + 'px';
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  if (my !== token) return;
  $('stage').replaceChildren(c);
  $('pg').textContent = `${cur} / ${pdf.numPages}`;
}

let opener = null;
function openPage(i) { opener = document.activeElement; cur = i; $('lb').classList.add('on'); show(); $('close').focus(); }
function go(d) { const n = cur + d; if (n >= 1 && n <= pdf.numPages) { cur = n; show(); } }
$('close').onclick = () => { $('lb').classList.remove('on'); opener && opener.focus(); };
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('fit').onclick = () => { fitMode = !fitMode; show(); };
addEventListener('keydown', e => {
  if (!$('lb').classList.contains('on')) return;
  if (e.key === 'Escape') $('close').click();
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
addEventListener('resize', () => $('lb').classList.contains('on') && show());
</script>
</body>
</html>
